name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The compiler this project is developed against: stock V 0.5.2, the
  # official release (vlang/v tag 0.5.2, reports itself as "V 0.5.2 7647ce1").
  # Not vlang/v master, which also reports "V 0.5.2" for other commits but
  # resolves project-local modules differently.
  #
  # A CI runner that installs a different compiler than the developer is worse
  # than no CI: it reports a failure that does not reproduce locally, or -- far
  # worse -- passes while checking something other than what is shipped.
  # The release archive is that compiler, byte for byte, on every machine.
  V_VERSION: 0.5.2

  # On macOS, Linux and BSD `v` tries its experimental V3 compiler first and
  # silently falls back to the established one when V3 declines the program.
  # Refusing the fallback makes Linux behave like the Windows development
  # machine instead of quietly testing a different compiler.
  V_MACOS_V3_NO_FALLBACK: '1'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The key is the compiler release AND the runner OS.
      #
      # The OS is in the key because `ubuntu-latest` changed underneath this
      # workflow before: a cache built by an older runner image stopped running
      # on the current one. A cache key on the compiler alone is a promise
      # that a binary downloaded on one image runs on every later one.
      - name: Cache the V compiler
        id: vcache
        uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_VERSION }}-${{ runner.os }}

      # Install stock V, and say WHY it could not.
      #
      # This step has failed several times and the failure has been invisible:
      # the log API needs admin rights this token does not have, so `gh run view
      # --log-failed` dies on a TLS handshake timeout from some networks and a
      # 403 from others. A toolchain that cannot be diagnosed is not one
      # anyone can fix. So the download is verified first and the result is
      # verified to actually run.
      - name: Install V
        if: steps.vcache.outputs.cache-hit != 'true'
        run: |
          set -e
          set -o pipefail
          # The release archive is the whole toolchain: the prebuilt binary
          # plus the vlib beside it. Installing only the executable out of
          # one leaves V unable to find its vlib, so the zip is kept intact.
          if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1; then
            echo "::error::no C compiler: V compiles every program with cc"
            cc --version || true
            gcc --version || true
            exit 1
          fi
          # blip programs link against Boehm GC. The runner image does not
          # ship libgc-dev, so install it up front rather than debugging a
          # link failure later.
          if ! command -v pkg-config >/dev/null 2>&1 || ! pkg-config --exists bdw-gc 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y libgc-dev
          fi
          curl -sSL -o v.zip "https://github.com/vlang/v/releases/download/${V_VERSION}/v_linux.zip"
          rm -rf v_dl && mkdir v_dl
          unzip -q v.zip -d v_dl
          rm -rf v && mv v_dl/v v && rm -rf v_dl v.zip
          if [ ! -x ./v/v ]; then
            echo "::error::Install V failed — no ./v/v produced"
            ls -la
            exit 1
          fi
          ./v/v version
      - name: Put V on PATH
        run: echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Confirm the toolchain
        run: |
          v version
          gcc --version | head -n 1

      # The generated prims must match the compiler they were read from. A
      # V_VERSION bump that changes vlib fails here until tools/genprims.vsh
      # is re-run and the result reviewed -- see docs/010-roadmap.md 7.1.
      - name: Generated prims are current
        run: v -cc gcc -path 'vlib|@vlib' run tools/genprims.vsh --check

      # `-cc gcc` everywhere, matching the local build commands in the README.
      # The default C backend fails on this checkout.
      #
      # `-path 'vlib|@vlib'` points the compiler at this repo's own vlib/ for
      # `import blip.*`, with the standard library still behind it. Stock V
      # does not resolve `vlib.`-prefixed project imports (only the master's
      # project-local lookup did), so the imports spell the short name and
      # the path supplies the directory.
      - name: Build everything
        run: |
          v -cc gcc -path 'vlib|@vlib' -o blip main.v
          v -cc gcc -path 'vlib|@vlib' -o reader_probe reader_probe.v
          v -cc gcc -path 'vlib|@vlib' -o tail tests/tail_calls.v
          v -cc gcc -path 'vlib|@vlib' -o non_tail tests/non_tail.v
          v -cc gcc -path 'vlib|@vlib' -o loop_forms tests/loop_forms.v
          v -cc gcc -path 'vlib|@vlib' -o binding_forms tests/binding_forms.v
          v -cc gcc -path 'vlib|@vlib' -o embedding tests/embedding.v
          v -cc gcc -path 'vlib|@vlib' -o repl_golden tests/repl_golden.v
          v -cc gcc -path 'vlib|@vlib' -o examples_run tests/examples_run.v
          v -cc gcc -path 'vlib|@vlib' -o programs_run tests/programs_run.v
          v -cc gcc -path 'vlib|@vlib' -o genprims tests/genprims.v
          v -cc gcc -path 'vlib|@vlib' -o unit tests/unit.v
          v -cc gcc -path 'vlib|@vlib' -o api_coverage tests/api_coverage.v
          v -cc gcc -path 'vlib|@vlib' -o emit_js tests/emit_js.v
          v -cc gcc -path 'vlib|@vlib' -o lsp tests/lsp.v
          v -cc gcc -path 'vlib|@vlib' -o hostile tests/hostile.v
          v -cc gcc -path 'vlib|@vlib' -o multi_use tests/multi_use.v
          v -cc gcc -path 'vlib|@vlib' -o value_to_datum tests/value_to_datum.v
          v -cc gcc -path 'vlib|@vlib' -o macros_gate tests/macros_gate.v
          v -cc gcc -path 'vlib|@vlib' -o fibers tests/fibers.v
          v -cc gcc -path 'vlib|@vlib' -o veb_bridge tests/veb_bridge.v
          v -cc gcc -path 'vlib|@vlib' -o embed_api tests/embed_api.v
          v -cc gcc -path 'vlib|@vlib' -o provenance tests/provenance.v
          v -cc gcc -path 'vlib|@vlib' -o contracts tests/contracts.v

      # These runners print results and do not set an exit code yet, so the
      # output is checked rather than the status. That is listed as a known gap
      # in docs/010-roadmap.md: errors becoming values is what will remove it.
      - name: Run the suites
        run: |
          set -o pipefail
          ./tail           | tee out.txt
          ./non_tail       | tee -a out.txt
          ./loop_forms     | tee -a out.txt
          ./binding_forms  | tee -a out.txt
          ./embedding      | tee -a out.txt
          ./repl_golden    | tee -a out.txt
          ./examples_run   | tee -a out.txt
          ./programs_run   | tee -a out.txt
          ./genprims       | tee -a out.txt
          ./unit           | tee -a out.txt
          ./api_coverage   | tee -a out.txt
          ./emit_js       | tee -a out.txt
          ./lsp            | tee -a out.txt
          ./hostile        | tee -a out.txt
          ./multi_use      | tee -a out.txt
          ./value_to_datum | tee -a out.txt
          ./macros_gate    | tee -a out.txt
          ./fibers         | tee -a out.txt
          ./veb_bridge     | tee -a out.txt
          ./embed_api      | tee -a out.txt
          ./provenance     | tee -a out.txt
          ./contracts      | tee -a out.txt
          if grep -qE '^FAIL|panic' out.txt; then
            echo "::error::a check failed or the machine panicked"
            exit 1
          fi

      - name: Every example parses
        run: ./reader_probe examples/*.lip

  # Three images, one per toolchain, each building the pinned V compiler from
  # source. That is slow -- V bootstraps itself -- so it is a separate job that
  # runs in parallel and is not gated behind the test job, because a change to
  # the build should be visible here before it is merged rather than after.
  #
  # This job has no path filter, so it runs on every push to main and every PR,
  # like the test job above (see `on:` at the top of this file).
  docker-images:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the Alpine image
        run: docker build -f docker/alpine.Dockerfile -t blip:alpine .

      - name: Build the Debian image
        run: docker build -f docker/debian.Dockerfile -t blip:debian .

      - name: Build the Nix image
        run: docker build -f docker/nix.Dockerfile -t blip:nix .

      # An image that builds is not proof; one that REPLACES its entrypoint
      # and prints a version is. This runs the binary inside each of the three
      # toolchains and compares them, so a build that only succeeds because of
      # the host cannot pass.
      - name: Run the binary in all three
        run: |
          set -e
          for t in alpine debian nix; do
            echo "== blip:$t =="
            docker run --rm --entrypoint blip blip:$t version
          done

      # The prelude must ship. std_path() finds it beside the binary, and the
      # Dockerfiles copy it to /usr/local/lib/std.lip, so a program that uses
      # the standard library has to run inside the image.
      - name: The image runs a real program
        run: |
          set -e
          printf '(print (+ 1 2))\n(print (string-upcase "ok"))\n' > prog.lip
          docker run --rm --entrypoint blip -v "$PWD/prog.lip:/w/prog.lip" \
            blip:alpine run /w/prog.lip | tee alpine-run.txt
          grep -q 3 alpine-run.txt
          grep -q OK alpine-run.txt
