name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The compiler this project is developed against, pinned. Not the 0.5.2
  # release: vlang/v master at 0137eb5 also reports itself as "V 0.5.2", but it
  # is a different build.
  #
  # A CI runner that installs a different compiler than the developer is worse
  # than no CI: it reports a failure that does not reproduce locally, or -- far
  # worse -- passes while checking something other than what is shipped.
  V_COMMIT: 7ec48941f8df47e5a0556c6365c6c873918f6c6b

  # vc is the C source V bootstraps itself from, and it is a SEPARATE repository
  # from V. The Makefile clones it at HEAD -- UNPINNED -- while V_COMMIT is
  # pinned, so a vc snapshot generated from a newer V carries a parser that
  # rejects the pinned V's own vlib. vc HEAD gained "reject `if` conditions that
  # start with a parenthesized if expression" on 2026-10-05, and
  # vlib/math/bits/bits.v at this V_COMMIT uses exactly that shape at line 621.
  # This is the snapshot taken just after V_COMMIT, before that change.
  VC_COMMIT: 8fb9f78d04e564a4e556d9a4eaea63067d341030

  # On macOS, Linux and BSD `v` tries its experimental V3 compiler first and
  # silently falls back to the established one when V3 declines the program. The
  # two resolve `import vlib.blip.reader` differently -- the established one
  # looks in V's standard library and reports every module here as unknown --
  # so the fallback turned a working build into a wall of "unknown function"
  # errors naming files that exist and compile locally.
  #
  # Refusing the fallback makes Linux behave like the Windows development
  # machine instead of quietly testing a different compiler.
  V_MACOS_V3_NO_FALLBACK: '1'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The key is the compiler commit AND the runner OS, versioned.
      #
      # The OS is in the key because `ubuntu-latest` changed underneath this
      # workflow: a cache built by an older runner image stopped running on the
      # current one, and `v version` failed inside a cache hit while the
      # build step was skipped. A cache key on the compiler alone is a promise
      # that a binary compiled on one image runs on every later one.
      #
      # The `-v2` is because the existing cache is poisoned and a key that only
      # appends a component will not be re-run for a tree whose key is already
      # warm: the whole point is to force a fresh build once.
      - name: Cache the V compiler
        id: vcache
        uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_COMMIT }}-${{ runner.os }}-v2

      # Build V, and say WHY it could not.
      #
      # This step has failed several times and the failure has been invisible:
      # the log API needs admin rights this token does not have, so `gh run view
      # --log-failed` dies on a TLS handshake timeout from some networks and a
      # 403 from others. A build that cannot be diagnosed is not a build anyone
      # can fix. So the compiler is checked for FIRST, the make output is not
      # swallowed, and the result is verified to actually run.
      - name: Build V
        if: steps.vcache.outputs.cache-hit != 'true'
        run: |
          set -e
          set -o pipefail
          # No release archive: the prebuilt ones are a different compiler, and
          # installing only the executable out of one leaves V unable to find
          # the vlib beside it. Build the pinned commit instead.
          if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1; then
            echo "::error::no C compiler: the V bootstrap compiles vc/v.c with cc"
            cc --version || true
            gcc --version || true
            exit 1
          fi
          # V links its own binary against Boehm GC. The runner image does not
          # ship libgc-dev, so the `make -f Makefile v` step dies with
          # "Boehm GC library was not found". Install it up front.
          if ! command -v pkg-config >/dev/null 2>&1 || ! pkg-config --exists bdw-gc 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y libgc-dev
          fi
          git init -q v
          cd v
          git remote add origin https://github.com/vlang/v.git
          git fetch -q --depth 1 origin "$V_COMMIT"
          git checkout -q FETCH_HEAD
          # vc is the C source the bootstrap compiles into `v`. The Makefile
          # clones it at HEAD -- UNPINNED -- while V_COMMIT is pinned, so a vc
          # snapshot generated from a newer V can carry a parser that rejects
          # the pinned tree's own vlib. That is exactly what happened here: vc
          # HEAD gained "reject `if` conditions that start with a parenthesized
          # if expression" on 2026-10-05, and vlib/math/bits/bits.v at this
          # V_COMMIT uses exactly that shape at line 621, so the build died
          # compiling a file the pinned commit itself ships.
          #
          # So vc is cloned at its own pin: a snapshot taken after V_COMMIT but
          # before that parser change. The `v` target is then built directly
          # rather than through `all`, because `all` depends on download_vc,
          # which pulls vc back to HEAD and undoes this.
          git clone -q https://github.com/vlang/vc vc
          git -C vc fetch -q --depth 1 origin "$VC_COMMIT"
          git -C vc checkout -q FETCH_HEAD
          # V builds its own Boehm GC from the source in thirdparty/libgc by
          # default; on this runner image the prebuilt path lookup failed and
          # it tried the wrong directory ("thirdparty/tcc/lib/libgc.a", a path
          # that belongs to tcc, not the GC), dying with "Boehm GC library was
          # not found". Building from source with -d use_bundled_libgc makes
          # the Makefile use the bundled gc.c directly and needs no system
          # libgc at all, so the libgc-dev install above is kept as a fallback
          # for anything else that wants a shared GC.
          # Fix: V looks for libgc.a at thirdparty/tcc/lib/libgc.a but libgc-dev
          # installs to /usr/lib/x86_64-linux-gnu/libgc.a; copy it into place.
          # NOTE: we already did `cd v` above, so these paths are relative to
          # the V checkout (not `v/...`).
          #
          # VFLAGS MUST be quoted. Unquoted (`VFLAGS=-d use_bundled_libgc`), make
          # reads the assignment as `VFLAGS=-d` and treats `use_bundled_libgc`
          # as a second goal; V then dies with `option '-d' requires a value`
          # and make reports Makefile:33. Three CI runs lost to this before
          # build.log captured the real error — the Dockerfiles quote it and
          # pass the same line.
          mkdir -p thirdparty/tcc/lib
          cp /usr/lib/x86_64-linux-gnu/libgc.a thirdparty/tcc/lib/libgc.a 2>/dev/null || cp /usr/lib/libgc.a thirdparty/tcc/lib/libgc.a 2>/dev/null || true
          make -f Makefile v VFLAGS="-d use_bundled_libgc" 2>&1 | tee build.log
          if [ ! -x ./v ]; then
            echo "::error::Build V failed — see build.log"
            cat build.log || true
            echo "--- dir contents ---"
            ls -la
            echo "--- libgc check ---"
            ls -la thirdparty/tcc/lib/libgc.a 2>/dev/null || echo "libgc.a missing"
            exit 1
          fi
          ./v version
      - name: Put V on PATH
        run: echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Confirm the toolchain
        run: |
          v version
          gcc --version | head -n 1

      # The generated prims must match the compiler they were read from. A
      # V_COMMIT bump that changes vlib fails here until tools/genprims.vsh
      # is re-run and the result reviewed -- see docs/010-roadmap.md 7.1.
      - name: Generated prims are current
        run: v -cc gcc run tools/genprims.vsh --check

      # `-cc gcc` everywhere, matching the local build commands in the README.
      # The default C backend fails on this checkout.
      - name: Build everything
        run: |
          v -cc gcc -o blip blip.v
          v -cc gcc -o reader_probe reader_probe.v
          v -cc gcc -o tail tests/tail_calls.v
          v -cc gcc -o non_tail tests/non_tail.v
          v -cc gcc -o loop_forms tests/loop_forms.v
          v -cc gcc -o binding_forms tests/binding_forms.v
          v -cc gcc -o embedding tests/embedding.v
          v -cc gcc -o repl_golden tests/repl_golden.v
          v -cc gcc -o examples_run tests/examples_run.v
          v -cc gcc -o programs_run tests/programs_run.v
          v -cc gcc -o genprims tests/genprims.v
          v -cc gcc -o unit tests/unit.v
          v -cc gcc -o api_coverage tests/api_coverage.v
          v -cc gcc -o emit_js tests/emit_js.v
          v -cc gcc -o lsp tests/lsp.v
          v -cc gcc -o hostile tests/hostile.v
          v -cc gcc -o multi_use tests/multi_use.v
          v -cc gcc -o value_to_datum tests/value_to_datum.v
          v -cc gcc -o macros_gate tests/macros_gate.v

      # These runners print results and do not set an exit code yet, so the
      # output is checked rather than the status. That is listed as a known gap
      # in docs/010-roadmap.md: errors becoming values is what will remove it.
      - name: Run the suites
        run: |
          set -o pipefail
          ./tail           | tee out.txt
          ./non_tail       | tee -a out.txt
          ./loop_forms     | tee -a out.txt
          ./binding_forms  | tee -a out.txt
          ./embedding      | tee -a out.txt
          ./repl_golden    | tee -a out.txt
          ./examples_run   | tee -a out.txt
          ./programs_run   | tee -a out.txt
          ./genprims       | tee -a out.txt
          ./unit           | tee -a out.txt
          ./api_coverage   | tee -a out.txt
          ./emit_js       | tee -a out.txt
          ./lsp            | tee -a out.txt
          ./hostile        | tee -a out.txt
          ./multi_use      | tee -a out.txt
          ./value_to_datum | tee -a out.txt
          ./macros_gate    | tee -a out.txt
          if grep -qE '^FAIL|panic' out.txt; then
            echo "::error::a check failed or the machine panicked"
            exit 1
          fi

      - name: Every example parses
        run: ./reader_probe examples/*.lip

  # Three images, one per toolchain, each building the pinned V compiler from
  # source. That is slow -- V bootstraps itself -- so it is a separate job that
  # runs in parallel and is not gated behind the test job, because a change to
  # the build should be visible here before it is merged rather than after.
  #
  # `docker build` is not run on every push: an image is a promise about a
  # published artifact, so it builds when the source that defines one changes.
  docker-images:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the Alpine image
        run: docker build -f docker/alpine.Dockerfile -t blip:alpine .

      - name: Build the Debian image
        run: docker build -f docker/debian.Dockerfile -t blip:debian .

      - name: Build the Nix image
        run: docker build -f docker/nix.Dockerfile -t blip:nix .

      # An image that builds is not proof; one that REPLACES its entrypoint
      # and prints a version is. This runs the binary inside each of the three
      # toolchains and compares them, so a build that only succeeds because of
      # the host cannot pass.
      - name: Run the binary in all three
        run: |
          set -e
          for t in alpine debian nix; do
            echo "== blip:$t =="
            docker run --rm --entrypoint blip blip:$t version
          done

      # The prelude must ship. std_path() finds it beside the binary, and the
      # Dockerfiles copy it to /usr/local/lib/std.lip, so a program that uses
      # the standard library has to run inside the image.
      - name: The image runs a real program
        run: |
          set -e
          printf '(print (+ 1 2))\n(print (string-upcase "ok"))\n' > prog.lip
          docker run --rm --entrypoint blip -v "$PWD/prog.lip:/w/prog.lip" \
            blip:alpine run /w/prog.lip | tee alpine-run.txt
          grep -q 3 alpine-run.txt
          grep -q OK alpine-run.txt
