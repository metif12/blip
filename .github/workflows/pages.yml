name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'blip.v'
      - 'vlib/blip/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race: a newer commit cancels an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      V_COMMIT: 74be97a2d7bd1fce4150abc749a2e64b21d9d082
      VC_COMMIT: 0027130e9850c9946fa2c21e9004f13d8e593595
      V_MACOS_V3_NO_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_COMMIT }}-${{ runner.os }}-v2

      - name: Build V if needed
        run: |
          set -e
          if [ ! -x v/v ]; then
            git init -q v && cd v
            git remote add origin https://github.com/vlang/v.git
            git fetch -q --depth 1 origin "$V_COMMIT"
            git checkout -q FETCH_HEAD
            git clone -q https://github.com/vlang/vc vc
            git -C vc fetch -q --depth 1 origin "$VC_COMMIT"
            git -C vc checkout -q FETCH_HEAD
            make -f Makefile v VFLAGS="-d use_bundled_libgc"
            [ -x ./v ] || { echo "::error::no ./v produced"; exit 1; }
          fi
          echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Build blip
        run: |
          v -cc gcc -o blip blip.v
          [ -x ./blip ] || { echo "::error::no ./blip produced"; exit 1; }
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Generate the site
        run: |
          rm -rf site_out
          ./blip run site/build.lip

      - name: Check the output is complete
        run: |
          test -s site_out/index.html
          test -s site_out/about.html
          test -s site_out/getting-started.html
          pages=$(find site_out -name '*.html' | wc -l)
          echo "generated $pages pages"
          test "$pages" -ge 3

      - name: Assemble site
        run: |
          cp -r site/assets site_out/assets
          cp README.md site_out/README.md 2>/dev/null || true
          cp site/install.sh site/install.ps1 site_out/ 2>/dev/null || true
          chmod +x site_out/install.sh 2>/dev/null || true
          test -f site_out/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4