name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'main.v'
      - 'vlib/blip/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race: a newer commit cancels an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      V_VERSION: 0.5.2
      V_MACOS_V3_NO_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_VERSION }}-${{ runner.os }}

      - name: Install V if needed
        run: |
          set -e
          if [ ! -x v/v ]; then
            curl -sSL -o v.zip "https://github.com/vlang/v/releases/download/${V_VERSION}/v_linux.zip"
            rm -rf v_dl && mkdir v_dl
            unzip -q v.zip -d v_dl
            rm -rf v && mv v_dl/v v && rm -rf v_dl v.zip
            [ -x ./v/v ] || { echo "::error::no ./v/v produced"; exit 1; }
          fi
          echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Build blip
        run: |
          v -cc gcc -path 'vlib|@vlib' -o blip main.v
          [ -x ./blip ] || { echo "::error::no ./blip produced"; exit 1; }
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Generate the site
        run: |
          rm -rf site_out
          ./blip run site/build.lip

      - name: Check the output is complete
        run: |
          test -s site_out/index.html
          test -s site_out/about.html
          test -s site_out/getting-started.html
          pages=$(find site_out -name '*.html' | wc -l)
          echo "generated $pages pages"
          test "$pages" -ge 3

      - name: Assemble site
        run: |
          cp -r site/assets site_out/assets
          cp README.md site_out/README.md 2>/dev/null || true
          cp site/install.sh site/install.ps1 site_out/ 2>/dev/null || true
          chmod +x site_out/install.sh 2>/dev/null || true
          test -f site_out/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4