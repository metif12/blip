name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/sitegen.v'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race: a newer commit cancels an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      V_COMMIT: 74be97a2d7bd1fce4150abc749a2e64b21d9d082
      # vc is the C source V bootstraps itself from, and it is a SEPARATE
      # repository from V. Pinning V without pinning vc is what broke this: the
      # Makefile clones vc at HEAD, so a snapshot built from a newer V was used
      # to compile the pinned V's own vlib. This is the snapshot taken just
      # after V_COMMIT.
      VC_COMMIT: 0027130e9850c9946fa2c21e9004f13d8e593595
      V_MACOS_V3_NO_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_COMMIT }}-${{ runner.os }}-v2

      # Build the compiler with the legacy Makefile explicitly, and with vc
      # pinned.
      #
      # Two build files exist: `GNUmakefile`, whose `all` pulls vc, tcc AND
      # macports-legacy through bash helpers, and `Makefile`, whose `all` is
      # `download_vc v` -- the shape this step was written for. GNU make prefers
      # GNUmakefile when both exist, so a bare `make` reads the newer one.
      #
      # vc is cloned at its own pin rather than left to the Makefile, which
      # clones it at HEAD: that is what made a newer V's parser reject the
      # pinned V's own vlib. The `v` target is built directly, because `all`
      # depends on download_vc, which pulls vc back to HEAD.
      - name: Build V if needed
        run: |
          set -e
          if [ ! -x v/v ]; then
            git init -q v && cd v
            git remote add origin https://github.com/vlang/v.git
            git fetch -q --depth 1 origin "$V_COMMIT"
            git checkout -q FETCH_HEAD
            git clone -q https://github.com/vlang/vc vc
            git -C vc fetch -q --depth 1 origin "$VC_COMMIT"
            git -C vc checkout -q FETCH_HEAD
            make -f Makefile v VFLAGS="-d use_bundled_libgc"
            [ -x ./v ] || { echo "::error::no ./v produced"; exit 1; }
          fi
          echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      # The site is generated, not hand-edited. `tools/sitegen.v` reads the page
      # structure from V and the strings from site/i18n/*.json, and emits every
      # language directory. Sixteen languages times four pages is not something
      # to keep consistent by hand.
      #
      # It fails the build if any language directory comes out empty, so a
      # translation that silently produced nothing cannot reach production.
      - name: Generate the site
        run: |
          v -cc gcc -d use_bundled_libgc -o sitegen tools/sitegen.v
          ./sitegen | tee sitegen.log

      # The generator puts English at the site root and every other language
      # under its own code, so English gets no prefix at all -- not even for its
      # sub-pages. Getting this wrong is exactly what the check below caught the
      # first time it ran.
      - name: Check the output is complete
        run: |
          test -s site_out/index.html
          for p in features docs guides; do
            test -s "site_out/$p/index.html" || { echo "::error::missing site_out/$p/index.html"; exit 1; }
          done
          for d in en fa ar es fr de pt ru uk pl nl tr hi zh ja ko; do
            [ "$d" = "en" ] && continue
            for p in "" features docs guides; do
              f="site_out/$d/$p/index.html"
              test -s "$f" || { echo "::error::missing or empty $f"; exit 1; }
            done
          done
          pages=$(find site_out -name index.html | wc -l)
          echo "generated $pages pages"
          test "$pages" -eq 64

      - name: Assemble site
        run: |
          cp -r site/assets site_out/assets
          cp README.md site_out/README.md
          cp CONTRIBUTING.md site_out/CONTRIBUTING.md
          # The installers. The README and the site both tell a reader to run
          # `curl -fsSL https://metif12.github.io/blip/install.sh | bash`, and
          # those URLs 404ed: the scripts lived in site/ but nothing ever copied
          # them into site_out, so the one-liner the whole install section
          # depends on pointed at a file that was never published.
          cp site/install.sh site/install.ps1 site_out/
          chmod +x site_out/install.sh
          test -f site_out/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
