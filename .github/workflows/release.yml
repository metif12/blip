name: release

# Releases are cut from main only, by pushing a version tag.
#
# The trigger is a tag rather than a manual dispatch on purpose: a release that
# can be produced from any branch is a release whose contents depend on which
# branch someone happened to be standing on. main is the stable line, so the
# tag is the only thing that decides what ships.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify, but do not publish'
        type: boolean
        default: true

permissions:
  contents: write

env:
  V_VERSION: 0.5.2

  # See ci.yml for why the stock release (not a master build) is used.
  V_MACOS_V3_NO_FALLBACK: '1'

jobs:
  verify:
    # The gate. Nothing is built for release until this passes, and it runs the
    # same commands a contributor runs locally, in the order they appear in
    # CONTRIBUTING.md.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_VERSION }}-${{ runner.os }}

      - name: Install V if needed
        # The release archive is the whole toolchain: binary plus the vlib
        # beside it. No source build, no vc bootstrap.
        run: |
          set -e
          if [ ! -x v/v ]; then
            curl -sSL -o v.zip "https://github.com/vlang/v/releases/download/${V_VERSION}/v_linux.zip"
            rm -rf v_dl && mkdir v_dl
            unzip -q v.zip -d v_dl
            rm -rf v && mv v_dl/v v && rm -rf v_dl v.zip
            [ -x ./v/v ] || { echo "::error::no ./v/v produced"; exit 1; }
          fi

      - name: Put V on PATH
        run: echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Build and test exactly as CONTRIBUTING says
        run: |
          v -cc gcc -path 'vlib|@vlib' -o blip main.v
          v -cc gcc -path 'vlib|@vlib' -o reader_probe reader_probe.v
          v -cc gcc -path 'vlib|@vlib' -o tail tests/tail_calls.v
          v -cc gcc -path 'vlib|@vlib' -o non_tail tests/non_tail.v
          v -cc gcc -path 'vlib|@vlib' -o loop_forms tests/loop_forms.v
          v -cc gcc -path 'vlib|@vlib' -o binding_forms tests/binding_forms.v
          v -cc gcc -path 'vlib|@vlib' -o embedding tests/embedding.v
          v -cc gcc -path 'vlib|@vlib' -o repl_golden tests/repl_golden.v
          v -cc gcc -path 'vlib|@vlib' -o examples_run tests/examples_run.v
          v -cc gcc -path 'vlib|@vlib' -o programs_run tests/programs_run.v
          v -cc gcc -path 'vlib|@vlib' -o genprims tests/genprims.v
          v -cc gcc -path 'vlib|@vlib' run tools/genprims.vsh --check
          set -o pipefail
          ./tail          | tee out.txt
          ./non_tail      | tee -a out.txt
          ./loop_forms    | tee -a out.txt
          ./binding_forms | tee -a out.txt
          ./embedding     | tee -a out.txt
          ./repl_golden   | tee -a out.txt
          ./examples_run  | tee -a out.txt
          ./programs_run  | tee -a out.txt
          ./genprims      | tee -a out.txt
          if grep -qE '^FAIL|panic' out.txt; then
            echo "::error::refusing to release: a check failed"
            exit 1
          fi
          ./reader_probe examples/*.blip

  build:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_VERSION }}-${{ runner.os }}
      - run: |
          if [ ! -x v/v ]; then
            curl -sSL -o v.zip "https://github.com/vlang/v/releases/download/${V_VERSION}/v_linux.zip"
            rm -rf v_dl && mkdir v_dl
            unzip -q v.zip -d v_dl
            rm -rf v && mv v_dl/v v && rm -rf v_dl v.zip
          fi
          echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Build release binaries
        run: |
          mkdir -p dist
          # Static-ish linux binary via musl would need another toolchain; the
          # release is a convenience, not a distribution format. Users who care
          # about a self-contained binary should build from source.
          v -cc gcc -path 'vlib|@vlib' -o dist/blip-linux main.v
          sudo apt-get update && sudo apt-get install -y mingw-w64
          v -os windows -cc gcc -path 'vlib|@vlib' -o dist/blip.exe main.v
          ls -la dist

      - name: Package
        run: |
          cd dist
          tar czf ../blip-linux.tar.gz blip-linux
          zip -q ../blip-windows.zip blip.exe
          cd ..
          mkdir -p site_out
          ./dist/blip-linux run site/build.blip
          test -s site_out/index.html
          test -s site_out/about.html
          test -s site_out/getting-started.html
          tar czf ../blip-site.tar.gz site_out
          sha256sum blip-*.tar.gz blip-*.zip blip-site.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The .deb reuses dist/blip-linux plus the repo's lib/ and programs/.
      # Version is the tag without the leading v; a dry run (no tag) still
      # builds and smokes the package with a 0.0.0 placeholder version.
      - name: Debian package
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dryrun"
          fi
          echo "packaging blip $VERSION"
          bash packaging/deb/build.sh "$VERSION" dist/blip-linux "blip_${VERSION}_amd64.deb"
          ls -la blip_*.deb

      # Smoking the installed package, not the build tree: this proves the
      # prelude resolves from /usr/share/blip and the binary runs from PATH.
      - name: Smoke test the installed package
        run: |
          set -e
          sudo dpkg -i blip_*.deb
          blip version
          printf '(println "deb smoke ok")\n' > /tmp/blip_smoke.blip
          test "$(blip run /tmp/blip_smoke.blip)" = '"deb smoke ok"'
          blip test examples/01_basics.blip
          sha256sum blip_*.deb >> SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: blip-dist
          path: |
            dist/blip-linux
            dist/blip.exe
            blip-linux.tar.gz
            blip-windows.zip
            blip-site.tar.gz
            blip_*.deb
            SHA256SUMS

  msi:
    # The Windows installer: WiX v4 builds it, msiexec installs it, and the
    # smoke runs the installed binary (never the build tree), then removes
    # it again. Signing is the known Track F blocker and is not attempted.
    needs: [build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blip-dist
          path: dist

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"

      - name: Build the MSI
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/v*') { $raw = "${{ github.ref }}".Substring('refs/tags/v'.Length) } else { $raw = '0.0.0' }
          $nums = @($raw -split '\.' | ForEach-Object { if ($_ -match '^\d+$') { [int]$_ } else { 0 } })
          while ($nums.Count -lt 4) { $nums += 0 }
          $ver = ($nums[0..3] -join '.')
          echo "packaging blip $ver"
          wix build packaging/msi/blip.wxs -o "blip_${ver}_amd64.msi" -d ProductVersion=$ver -d BinDir=dist -d RepoDir=.
          Get-ChildItem blip_*.msi

      - name: Smoke test the installed package
        shell: pwsh
        run: |
          $msi = Get-ChildItem blip_*.msi | Select-Object -First 1
          msiexec /i $msi.FullName /qn /norestart
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = 'C:\Program Files\blip\blip.exe'
          & $exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Content -Path $env:TEMP\msi_smoke.blip -Value '(println "msi smoke ok")' -NoNewline
          if ((& $exe run "$env:TEMP\msi_smoke.blip") -ne '"msi smoke ok"') { Write-Error 'run mismatch'; exit 1 }
          & $exe test examples/01_basics.blip
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $regPath = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').Path
          if ($regPath -notlike '*\blip*') { Write-Error 'PATH not registered'; exit 1 }
          msiexec /x $msi.FullName /qn /norestart
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path $exe) { Write-Error 'uninstall left the binary behind'; exit 1 }
          Get-FileHash $msi.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($msi.Name)" } | Out-File SHA256SUMS.msi -Encoding ascii
          Get-Content SHA256SUMS.msi

      - uses: actions/upload-artifact@v4
        with:
          name: blip-msi-dist
          path: |
            blip_*.msi
            SHA256SUMS.msi

  rpm:
    # The Red Hat package: same payload as the .deb, assembled with
    # rpmbuild and smoke-tested installed. Signing is out of scope the
    # same way MSI signing is (known Track F blocker, not a v2 promise).
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blip-dist
          path: dist

      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build the RPM
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0"
          fi
          echo "packaging blip $VERSION"
          bash packaging/rpm/build.sh "$VERSION" dist/blip-linux "blip-${VERSION}-1.x86_64.rpm"
          ls -la blip_*.rpm

      - name: Smoke test the installed package
        run: |
          set -e
          sudo rpm -i --force blip_*.rpm
          blip version
          printf '(println "rpm smoke ok")\n' > /tmp/rpm_smoke.blip
          test "$(blip run /tmp/rpm_smoke.blip)" = '"rpm smoke ok"'
          blip test examples/01_basics.blip
          sudo rpm -e blip
          if blip version; then echo "::error::uninstall left blip behind"; exit 1; fi
          sha256sum blip_*.rpm > SHA256SUMS.rpm
          cat SHA256SUMS.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: blip-rpm-dist
          path: |
            blip_*.rpm
            SHA256SUMS.rpm

  snap:
    # The Snap package: same payload as the .deb/.rpm, assembled with
    # snapcraft and smoke-tested installed with --dangerous (no store
    # account is wired up in v2, so sideloading is the distribution path;
    # classic confinement, as befits a dev tool). Signing/store review
    # are out of scope the same way MSI signing is.
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blip-dist
          path: dist

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build the snap
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0"
          fi
          echo "packaging blip $VERSION"
          bash packaging/snap/build.sh "$VERSION" dist/blip-linux .
          ls -la blip_*.snap

      - name: Smoke test the installed snap
        run: |
          set -e
          sudo snap install --dangerous --classic blip_*.snap
          blip version
          printf '(println "snap smoke ok")\n' > /tmp/snap_smoke.blip
          test "$(blip run /tmp/snap_smoke.blip)" = '"snap smoke ok"'
          blip test examples/01_basics.blip
          sudo snap remove blip
          if blip version; then echo "::error::uninstall left blip behind"; exit 1; fi
          sha256sum blip_*.snap > SHA256SUMS.snap
          cat SHA256SUMS.snap

      - uses: actions/upload-artifact@v4
        with:
          name: blip-snap-dist
          path: |
            blip_*.snap
            SHA256SUMS.snap

  appimage:
    # The AppImage: same payload as the .deb, assembled with appimagetool
    # and smoke-tested by running it directly (AppImages do not install).
    # Needs FUSE at run time; building needs only squashfs tools.
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blip-dist
          path: dist

      - name: Build the AppImage
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0"
          fi
          echo "packaging blip $VERSION"
          bash packaging/appimage/build.sh "$VERSION" dist/blip-linux .
          ls -la blip_*.AppImage

      - name: Smoke test the AppImage
        run: |
          set -e
          chmod +x blip_*.AppImage
          ./blip_*.AppImage version
          printf '(println "appimage smoke ok")\n' > /tmp/appimage_smoke.blip
          test "$(./blip_*.AppImage run /tmp/appimage_smoke.blip)" = '"appimage smoke ok"'
          ./blip_*.AppImage test examples/01_basics.blip
          sha256sum blip_*.AppImage > SHA256SUMS.appimage
          cat SHA256SUMS.appimage

      - uses: actions/upload-artifact@v4
        with:
          name: blip-appimage-dist
          path: |
            blip_*.AppImage
            SHA256SUMS.appimage

  flatpak:
    # The Flatpak: same payload as the .deb, assembled with
    # flatpak-builder against the Freedesktop runtime and smoke-tested
    # installed from a local repo (no Flathub submission in v2, same as
    # snap's no-store stance). No signing step: distribution is the
    # .flatpak file itself.
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blip-dist
          path: dist

      - name: Install flatpak tooling and runtime
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build the flatpak
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0"
          fi
          echo "packaging blip $VERSION"
          bash packaging/flatpak/build.sh "$VERSION" dist/blip-linux .
          ls -la blip_*.flatpak

      - name: Smoke test the installed flatpak
        run: |
          set -e
          sudo flatpak install -y ./blip_*.flatpak
          flatpak run io.github.metif12.blip version
          printf '(println "flatpak smoke ok")\n' > /tmp/flatpak_smoke.blip
          test "$(flatpak run io.github.metif12.blip run /tmp/flatpak_smoke.blip)" = '"flatpak smoke ok"'
          flatpak run io.github.metif12.blip test examples/01_basics.blip
          sudo flatpak uninstall -y io.github.metif12.blip
          if flatpak list --app 2>/dev/null | grep -q io.github.metif12.blip; then echo "::error::uninstall left blip behind"; exit 1; fi
          sha256sum blip_*.flatpak > SHA256SUMS.flatpak
          cat SHA256SUMS.flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: blip-flatpak-dist
          path: |
            blip_*.flatpak
            SHA256SUMS.flatpak

  publish:
    needs: [build, clib, msi, rpm, snap, appimage, flatpak]
    # Only tags publish. A manual dispatch builds and verifies, then stops, so a
    # dry run can never create a release by accident.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blip-dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: blip-msi-dist
          path: dist/msi

      - uses: actions/download-artifact@v4
        with:
          name: blip-rpm-dist
          path: dist/rpm

      - uses: actions/download-artifact@v4
        with:
          name: blip-snap-dist
          path: dist/snap

      - uses: actions/download-artifact@v4
        with:
          name: blip-appimage-dist
          path: dist/appimage

      - uses: actions/download-artifact@v4
        with:
          name: blip-flatpak-dist
          path: dist/flatpak

      - uses: actions/download-artifact@v4
        with:
          pattern: blip-clib-dist-*
          merge-multiple: true
          path: dist/clib

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/blip-linux.tar.gz
            dist/blip-windows.zip
            dist/blip-site.tar.gz
            dist/blip_*.deb
            dist/msi/blip_*.msi
            dist/SHA256SUMS
            dist/msi/SHA256SUMS.msi
            dist/rpm/blip_*.rpm
            dist/rpm/SHA256SUMS.rpm
            dist/snap/blip_*.snap
            dist/snap/SHA256SUMS.snap
            dist/appimage/blip_*.AppImage
            dist/appimage/SHA256SUMS.appimage
            dist/flatpak/blip_*.flatpak
            dist/flatpak/SHA256SUMS.flatpak
            dist/clib/blip-clib-linux.tar.gz
            dist/clib/blip-clib-windows.zip
            dist/clib/SHA256SUMS.clib-linux
            dist/clib/SHA256SUMS.clib-windows
          generate_release_notes: true
          body: |
            Built from `${{ github.ref }}` by `.github/workflows/release.yml`.

            Reproduce it locally with the commands in `CONTRIBUTING.md`. The
            same nine suites run in the `verify` job before anything here was
            built, and the site in `blip-site.tar.gz` is the output of
            `site/build.blip` rather than something edited by hand.

            `blip-clib-*.tar.gz/.zip` is the C embedding library: `blip.h`,
            the shared object, a worked example and `docs/c-lib.md`.
            Build and usage commands are in `docs/c-lib.md`; the smoke test
            in `.github/workflows/clib.yml` runs the example against the
            packaged library on Linux and Windows.

            `blip_*.deb` installs on Debian/Ubuntu (`sudo dpkg -i`);
            `blip_*.msi` installs on Windows (double-click or
            `msiexec /i`); `blip_*.rpm` installs on Fedora/RHEL
            derivatives (`sudo rpm -i`); `blip_*.snap` sideloads
            anywhere with snapd
            (`sudo snap install --dangerous --classic`);
            `blip_*.AppImage` runs anywhere with FUSE (just `chmod +x`
            and run it); `blip_*.flatpak` installs anywhere with
            flatpak (`flatpak install` the file, then `flatpak run
            io.github.metif12.blip`). Each was smoke-tested before
            publishing.


  # The C library release. Same compiler pins as `verify` above and the same
  # build-and-smoke recipe as `.github/workflows/clib.yml` (that file is the
  # canonical copy -- keep the two in sync). The smoke test runs BEFORE
  # packaging, so a published tarball always contains a library that already
  # proved it can eval, call, sandbox and limit.
  clib:
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_VERSION }}-${{ runner.os }}

      - name: Install V if needed (linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          if [ ! -x v/v ]; then
            curl -sSL -o v.zip "https://github.com/vlang/v/releases/download/${V_VERSION}/v_linux.zip"
            rm -rf v_dl && mkdir v_dl
            unzip -q v.zip -d v_dl
            rm -rf v && mv v_dl/v v && rm -rf v_dl v.zip
            [ -x ./v/v ] || { echo "::error::no ./v/v produced"; exit 1; }
          fi

      - name: Install V if needed (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path v/v.exe)) {
            $zip = "$env:TEMP\v_windows.zip"
            Invoke-WebRequest -Uri "https://github.com/vlang/v/releases/download/$env:V_VERSION/v_windows.zip" -OutFile $zip
            if (Test-Path v) { Remove-Item -Recurse -Force v }
            Expand-Archive -Path $zip -DestinationPath v_dl -Force
            Move-Item v_dl/v v
            Remove-Item -Recurse -Force v_dl, $zip
            if (!(Test-Path v/v.exe)) { Write-Error "no v/v.exe produced"; exit 1 }
          }

      - name: Put V on PATH (linux)
        if: runner.os == 'Linux'
        run: echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Put V on PATH (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE/v"

      - name: MSVC environment (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build, smoke, package (linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          set -o pipefail
          mkdir -p dist pkg/blip-clib
          v -shared -cc gcc -path 'vlib|@vlib' -o dist/libblip.so clib/blip.v
          gcc clib/example_eval.c -o dist/clib_smoke -Ldist -lblip -Wl,-rpath,'$ORIGIN' -Iclib
          ./dist/clib_smoke | tee clib_smoke.txt
          grep -q 'clib smoke: all checks passed' clib_smoke.txt
          cp clib/blip.h clib/blip.def clib/example_eval.c clib/smoke_prog.blip docs/c-lib.md pkg/blip-clib/
          cp dist/libblip.so pkg/blip-clib/
          tar czf blip-clib-linux.tar.gz -C pkg blip-clib
          (cd dist && sha256sum libblip.so) > SHA256SUMS.clib-linux
          sha256sum blip-clib-linux.tar.gz >> SHA256SUMS.clib-linux
          cat SHA256SUMS.clib-linux

      - name: Build, smoke, package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, pkg/blip-clib | Out-Null
          v -shared -cc msvc -path "vlib|@vlib" -o dist/blip.dll clib/blip.v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          lib /def:clib/blip.def /out:dist/blip.lib /machine:x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo clib/example_eval.c dist/blip.lib /Iclib /Fedist/clib_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./dist/clib_smoke.exe | Tee-Object clib_smoke.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Select-String -Path clib_smoke.txt -Pattern 'clib smoke: all checks passed' | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error 'smoke marker missing'; exit 1 }
          Copy-Item clib/blip.h, clib/blip.def, clib/example_eval.c, clib/smoke_prog.blip, docs/c-lib.md pkg/blip-clib/
          Copy-Item dist/blip.dll, dist/blip.lib pkg/blip-clib/
          Compress-Archive -Path pkg/blip-clib -DestinationPath blip-clib-windows.zip
          Get-FileHash blip-clib-windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  blip-clib-windows.zip" } | Out-File SHA256SUMS.clib-windows -Encoding ascii
          Get-Content SHA256SUMS.clib-windows

      - uses: actions/upload-artifact@v4
        with:
          name: blip-clib-dist-${{ runner.os }}
          path: |
            blip-clib-linux.tar.gz
            blip-clib-windows.zip
            SHA256SUMS.clib-linux
            SHA256SUMS.clib-windows
