name: release

# Releases are cut from main only, by pushing a version tag.
#
# The trigger is a tag rather than a manual dispatch on purpose: a release that
# can be produced from any branch is a release whose contents depend on which
# branch someone happened to be standing on. main is the stable line, so the
# tag is the only thing that decides what ships.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify, but do not publish'
        type: boolean
        default: true

permissions:
  contents: write

env:
  V_COMMIT: 74be97a2d7bd1fce4150abc749a2e64b21d9d082

  # vc is the C source V bootstraps itself from, and it is a SEPARATE repository
  # from V. Pinning V without pinning vc is what broke this: the Makefile clones
  # vc at HEAD, so a snapshot built from a newer V was used to compile the
  # pinned V's own vlib. This is the snapshot taken just after V_COMMIT.
  VC_COMMIT: 0027130e9850c9946fa2c21e9004f13d8e593595
  V_MACOS_V3_NO_FALLBACK: '1'

jobs:
  verify:
    # The gate. Nothing is built for release until this passes, and it runs the
    # same commands a contributor runs locally, in the order they appear in
    # CONTRIBUTING.md.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_COMMIT }}-${{ runner.os }}-v2

      - name: Build V if needed
        # vc is pinned and the `v` target is built directly: the Makefile clones
        # vc at HEAD, and a vc snapshot generated from a newer V carries a
        # parser that rejects the pinned V's own vlib. `all` would pull vc back
        # to HEAD through download_vc.
        run: |
          set -e
          if [ ! -x v/v ]; then
            git init -q v
            cd v
            git remote add origin https://github.com/vlang/v.git
            git fetch -q --depth 1 origin "$V_COMMIT"
            git checkout -q FETCH_HEAD
            git clone -q https://github.com/vlang/vc vc
            git -C vc fetch -q --depth 1 origin "$VC_COMMIT"
            git -C vc checkout -q FETCH_HEAD
            make -f Makefile v
            [ -x ./v ] || { echo "::error::no ./v produced"; exit 1; }
          fi

      - name: Put V on PATH
        run: echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Build and test exactly as CONTRIBUTING says
        run: |
          v -cc gcc -o blip blip.v
          v -cc gcc -o reader_probe reader_probe.v
          v -cc gcc -o tail tests/tail_calls.v
          v -cc gcc -o non_tail tests/non_tail.v
          v -cc gcc -o loop_forms tests/loop_forms.v
          v -cc gcc -o binding_forms tests/binding_forms.v
          v -cc gcc -o embedding tests/embedding.v
          v -cc gcc -o repl_golden tests/repl_golden.v
          v -cc gcc -o examples_run tests/examples_run.v
          v -cc gcc -o programs_run tests/programs_run.v
          v -cc gcc -o genprims tests/genprims.v
          v -cc gcc run tools/genprims.vsh --check
          set -o pipefail
          ./tail          | tee out.txt
          ./non_tail      | tee -a out.txt
          ./loop_forms    | tee -a out.txt
          ./binding_forms | tee -a out.txt
          ./embedding     | tee -a out.txt
          ./repl_golden   | tee -a out.txt
          ./examples_run  | tee -a out.txt
          ./programs_run  | tee -a out.txt
          ./genprims      | tee -a out.txt
          if grep -qE '^FAIL|panic' out.txt; then
            echo "::error::refusing to release: a check failed"
            exit 1
          fi
          ./reader_probe examples/*.lip

  build:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_COMMIT }}-${{ runner.os }}-v2
      - run: |
          if [ ! -x v/v ]; then
            git init -q v && cd v
            git remote add origin https://github.com/vlang/v.git
            git fetch -q --depth 1 origin "$V_COMMIT"
            git checkout -q FETCH_HEAD && make
          fi
          echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Build release binaries
        run: |
          mkdir -p dist
          # Static-ish linux binary via musl would need another toolchain; the
          # release is a convenience, not a distribution format. Users who care
          # about a self-contained binary should build from source.
          v -cc gcc -o dist/blip-linux   blip.v
          v -cc gcc -o dist/blip-macos   blip.v
          v -cc gcc -o os:windows -cc gcc -o dist/blip.exe blip.v
          ls -la dist

      - name: Package
        run: |
          cd dist
          tar czf ../blip-linux-macos.tar.gz blip-linux blip-macos
          zip -q ../blip-windows.zip blip.exe
          cd ..
          mkdir -p site_out
          ./dist/blip-linux run site/build.lip
          test -s site_out/index.html
          test -s site_out/about.html
          test -s site_out/getting-started.html
          tar czf ../blip-site.tar.gz site_out
          sha256sum blip-*.tar.gz blip-*.zip blip-site.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: blip-dist
          path: |
            dist/blip-linux
            dist/blip-macos
            dist/blip.exe
            blip-linux-macos.tar.gz
            blip-windows.zip
            blip-site.tar.gz
            SHA256SUMS

  publish:
    needs: [build, clib]
    # Only tags publish. A manual dispatch builds and verifies, then stops, so a
    # dry run can never create a release by accident.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blip-dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: blip-clib-dist-*
          merge-multiple: true
          path: dist/clib

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/blip-linux-macos.tar.gz
            dist/blip-windows.zip
            dist/blip-site.tar.gz
            dist/SHA256SUMS
            dist/clib/blip-clib-linux.tar.gz
            dist/clib/blip-clib-windows.zip
            dist/clib/SHA256SUMS.clib-linux
            dist/clib/SHA256SUMS.clib-windows
          generate_release_notes: true
          body: |
            Built from `${{ github.ref }}` by `.github/workflows/release.yml`.

            Reproduce it locally with the commands in `CONTRIBUTING.md`. The
            same nine suites run in the `verify` job before anything here was
            built, and the site in `blip-site.tar.gz` is the output of
            `site/build.lip` rather than something edited by hand.

            `blip-clib-*.tar.gz/.zip` is the C embedding library: `blip.h`,
            the shared object, a worked example and `docs/c-lib.md`.
            Build and usage commands are in `docs/c-lib.md`; the smoke test
            in `.github/workflows/clib.yml` runs the example against the
            packaged library on Linux and Windows.

  # The C library release. Same compiler pins as `verify` above and the same
  # build-and-smoke recipe as `.github/workflows/clib.yml` (that file is the
  # canonical copy -- keep the two in sync). The smoke test runs BEFORE
  # packaging, so a published tarball always contains a library that already
  # proved it can eval, call, sandbox and limit.
  clib:
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_COMMIT }}-${{ runner.os }}-v2

      - name: Build V if needed (linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          if [ ! -x v/v ]; then
            git init -q v
            cd v
            git remote add origin https://github.com/vlang/v.git
            git fetch -q --depth 1 origin "$V_COMMIT"
            git checkout -q FETCH_HEAD
            git clone -q https://github.com/vlang/vc vc
            git -C vc fetch -q --depth 1 origin "$VC_COMMIT"
            git -C vc checkout -q FETCH_HEAD
            make -f Makefile v
            [ -x ./v ] || { echo "::error::no ./v produced"; exit 1; }
          fi

      - name: Build V if needed (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path v/v.exe)) {
            git init -q v
            cd v
            git remote add origin https://github.com/vlang/v.git
            git fetch -q --depth 1 origin "$env:V_COMMIT"
            git checkout -q FETCH_HEAD
            git clone -q https://github.com/vlang/vc vc
            git -C vc fetch -q --depth 1 origin "$env:VC_COMMIT"
            git -C vc checkout -q FETCH_HEAD
            cd ..
            cmd.exe /c "cd v && make.bat"
            if (!(Test-Path v/v.exe)) { Write-Error "no v/v.exe produced"; exit 1 }
          }

      - name: Put V on PATH (linux)
        if: runner.os == 'Linux'
        run: echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Put V on PATH (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE/v"

      - name: MSVC environment (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build, smoke, package (linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          set -o pipefail
          mkdir -p dist pkg/blip-clib
          v -shared -cc gcc -o dist/libblip.so clib/blip.v
          gcc clib/example_eval.c -o dist/clib_smoke -Ldist -lblip -Wl,-rpath,'$ORIGIN' -Iclib
          ./dist/clib_smoke | tee clib_smoke.txt
          grep -q 'clib smoke: all checks passed' clib_smoke.txt
          cp clib/blip.h clib/blip.def clib/example_eval.c clib/smoke_prog.lip docs/c-lib.md pkg/blip-clib/
          cp dist/libblip.so pkg/blip-clib/
          tar czf blip-clib-linux.tar.gz -C pkg blip-clib
          (cd dist && sha256sum libblip.so) > SHA256SUMS.clib-linux
          sha256sum blip-clib-linux.tar.gz >> SHA256SUMS.clib-linux
          cat SHA256SUMS.clib-linux

      - name: Build, smoke, package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, pkg/blip-clib | Out-Null
          v -shared -cc msvc -o dist/blip.dll clib/blip.v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          lib /def:clib/blip.def /out:dist/blip.lib /machine:x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo clib/example_eval.c dist/blip.lib /Iclib /Fedist/clib_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./dist/clib_smoke.exe | Tee-Object clib_smoke.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Select-String -Path clib_smoke.txt -Pattern 'clib smoke: all checks passed' | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error 'smoke marker missing'; exit 1 }
          Copy-Item clib/blip.h, clib/blip.def, clib/example_eval.c, clib/smoke_prog.lip, docs/c-lib.md pkg/blip-clib/
          Copy-Item dist/blip.dll, dist/blip.lib pkg/blip-clib/
          Compress-Archive -Path pkg/blip-clib -DestinationPath blip-clib-windows.zip
          Get-FileHash blip-clib-windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  blip-clib-windows.zip" } | Out-File SHA256SUMS.clib-windows -Encoding ascii
          Get-Content SHA256SUMS.clib-windows

      - uses: actions/upload-artifact@v4
        with:
          name: blip-clib-dist-${{ runner.os }}
          path: |
            blip-clib-linux.tar.gz
            blip-clib-windows.zip
            SHA256SUMS.clib-linux
            SHA256SUMS.clib-windows
