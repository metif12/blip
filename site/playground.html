<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blip playground</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --line: #262c37;
    --text: #d8dee9;
    --dim: #8b94a7;
    --accent: #7ee0a8;
    --accent2: #f0b072;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbfbfd; --panel: #ffffff; --line: #e3e6ec;
      --text: #1c2128; --dim: #5b6472; --accent: #1a7f4b; --accent2: #a35c12;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 60rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  h1 { font-size: 1.8rem; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
  .tag { color: var(--dim); font-size: 1rem; margin: 0 0 2rem; }
  .editor {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 1rem 1.1rem; font-family: var(--mono); font-size: 0.875rem; line-height: 1.6;
    width: 100%; min-height: 12rem; color: var(--text); resize: vertical;
  }
  .editor:focus { outline: none; border-color: var(--accent); }
  .controls { display: flex; gap: 0.75rem; margin: 1rem 0; }
  button {
    background: var(--accent); color: var(--bg); border: none; border-radius: 6px;
    padding: 0.5rem 1.2rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: transparent; color: var(--text); border: 1px solid var(--line);
  }
  .output {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 1rem 1.1rem; font-family: var(--mono); font-size: 0.875rem; line-height: 1.6;
    min-height: 6rem; white-space: pre-wrap; word-break: break-word;
  }
  .output .error { color: var(--accent2); }
  .output .success { color: var(--accent); }
  .status { color: var(--dim); font-size: 0.8rem; margin-top: 0.5rem; }
  .topnav { margin: 0 0 1.5rem; font-size: 0.9rem; }
  .topnav a { color: var(--accent); text-decoration: none; }
  .topnav a:hover { text-decoration: underline; }
  .note { color: var(--dim); font-size: 0.85rem; margin: 0 0 1rem; }
</style>
</head>
<body>
<div class="wrap">

  <p class="topnav"><a href="/index.html">&larr; blip home</a></p>

  <h1>blip playground</h1>
  <p class="tag">A small Lisp dialect implemented in V. Try it in your browser.</p>
  <p class="note">Run needs a local backend: <code>v run server.v</code>, then open this page from <code>localhost:8080</code>. On the static site the button has nothing to talk to.</p>

  <textarea class="editor" id="code" spellcheck="false">(define (fib n)
  (if (< n 2)
      n
      (+ (fib (- n 1))
         (fib (- n 2)))))

(fib 20)</textarea>

  <div class="controls">
    <button id="run">Run</button>
    <button class="secondary" id="clear">Clear output</button>
  </div>

  <div class="output" id="output"></div>
  <div class="status" id="status">Ready.</div>

</div>

<script>
const editor = document.getElementById('code');
const output = document.getElementById('output');
const status = document.getElementById('status');
const runBtn = document.getElementById('run');
const clearBtn = document.getElementById('clear');

function setStatus(msg) {
  status.textContent = msg;
}

function appendOutput(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  output.appendChild(span);
}

function clearOutput() {
  output.innerHTML = '';
}

async function runCode() {
  const code = editor.value;
  clearOutput();
  setStatus('Running...');

  try {
    const resp = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ code }).toString(),
    });

    if (!resp.ok) {
      const text = await resp.text();
      appendOutput(text, 'error');
      setStatus('Error.');
      return;
    }

    const data = await resp.json();
    if (data.output) {
      appendOutput(data.output, 'success');
    }
    if (data.error) {
      appendOutput(data.error, 'error');
    }
    setStatus(data.ran ? 'Done.' : 'Error.');
  } catch (e) {
    appendOutput('Cannot reach the server. Is the backend running?', 'error');
    setStatus('Connection failed.');
  }
}

runBtn.addEventListener('click', runCode);
clearBtn.addEventListener('click', () => {
  clearOutput();
  setStatus('Ready.');
});

editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCode();
  }
});
</script>
</body>
</html>
